version: 0.1.0
homepage: https://github.com/hainguyen-ar1/cyr_flutter_core
repository: https://github.com/hainguyen-ar1/cyr_flutter_core
issue_tracker: https://github.com/hainguyen-ar1/cyr_flutter_core/issues
